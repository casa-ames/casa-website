<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CASA Website Editor</title>
    <style>
      .image-prep-link {
        position: fixed;
        z-index: 10000;
        right: 1rem;
        bottom: 1rem;
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        padding: 0.7rem 1rem;
        background: #ff0000;
        color: #fff;
        font: 700 14px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
        text-decoration: none;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgb(0 0 0 / 18%);
      }

      .image-prep-link:hover { background: #000; }

      .image-prep-link:focus-visible { outline: 2px solid #ff0000; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <a class="image-prep-link" href="../image-prep/" target="_blank" rel="noreferrer">Prepare an image</a>
    <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
  </body>
</html>
